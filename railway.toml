# Railway deployment configuration
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT at runtime; the API honors it via APP_PORT fallback.
startCommand = "/usr/local/bin/api"
healthcheckPath = "/health"
# Increased timeout to allow migrations to complete on first startup
healthcheckTimeout = 60
# Increased start_period to allow initialization
startupProbeTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
