# SonarQube Project Configuration for BE Extension ERP

# Project identification
sonar.projectKey=be-extension-erp-dev
sonar.projectName=be-extension-erp-dev
sonar.projectVersion=1.0

# Source code location
sonar.sources=cmd,internal,pkg
sonar.tests=.

# Exclude directories
sonar.exclusions=**/*_test.go,**/vendor/**,**/migrations/**,**/*.pb.go,**/*.mock.go

# Test files pattern
sonar.test.inclusions=**/*_test.go

# Coverage report paths
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.out

# Go language specific
sonar.language=go
sonar.sourceEncoding=UTF-8

# SCM (Source Control Management)
sonar.scm.provider=git

# Additional settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
